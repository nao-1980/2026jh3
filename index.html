<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>5教科ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: 1画面1問のシール手帳。上にログフィルム、下に大きな答えボタン */
:root{
  --bg:#FFF4F8; --dot:#F7D9E6; --card:#FFFFFF; --line:#F3D6E3; --shadow:#F2C4D8;
  --ink:#43304A; --sub:#8E7A95; --pink:#FF5C9D; --pinkL:#FFE1EE; --lav:#9B7BFF; --lavL:#EEE7FF;
  --ok:#22A884; --okL:#DDF5EE; --ng:#E8536E; --ngL:#FDE3E8; --memo:#FFF9E8; --memoLine:#E9C97A;
  --btnEdge:#43304A; --gray:#D9CFDD;
  --fKoku:#FF8FB8; --fMath:#B49BFF; --fEng:#7CC4FF; --fSci:#5ED3A8; --fSoc:#FFC75A; --faceInk:#43304A;
  --head:"Mochiy Pop One","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1F1622; --dot:#2E2233; --card:#2B2030; --line:#45334C; --shadow:#140E16;
  --ink:#F6E9F3; --sub:#BBA6C2; --pink:#FF86B6; --pinkL:#4A2738; --lav:#B9A2FF; --lavL:#352B4F;
  --ok:#4FD1A9; --okL:#173A31; --ng:#FF7C93; --ngL:#45222B; --memo:#3A3122; --memoLine:#8C7440;
  --btnEdge:#0F0A11; --gray:#4A3D50; --fKoku:#E874A1; --fMath:#9A80F2; --fEng:#5DAAE8; --fSci:#3FBB8F; --fSoc:#E9AD45; --faceInk:#2A1D2F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1F1622; --dot:#2E2233; --card:#2B2030; --line:#45334C; --shadow:#140E16;
  --ink:#F6E9F3; --sub:#BBA6C2; --pink:#FF86B6; --pinkL:#4A2738; --lav:#B9A2FF; --lavL:#352B4F;
  --ok:#4FD1A9; --okL:#173A31; --ng:#FF7C93; --ngL:#45222B; --memo:#3A3122; --memoLine:#8C7440;
  --btnEdge:#0F0A11; --gray:#4A3D50; --fKoku:#E874A1; --fMath:#9A80F2; --fEng:#5DAAE8; --fSci:#3FBB8F; --fSoc:#E9AD45; --faceInk:#2A1D2F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:22px 22px;
  color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.7;font-weight:700;padding-inline:16px;padding-block:12px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--head);font-weight:400;margin:0;text-wrap:balance;line-height:1.35}
h1{font-size:1.6rem}h2{font-size:1.3rem}h3{font-size:1.1rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{font:inherit;font-weight:800;color:var(--ink);background:var(--card);border:2.5px solid var(--btnEdge);border-radius:999px;
  box-shadow:0 5px 0 var(--btnEdge);padding:12px 18px;cursor:pointer;transition:transform .08s,box-shadow .08s;min-height:52px;font-size:1.05rem}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btnEdge)}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--lav);outline-offset:3px}
.btn.main{background:var(--pink);color:#fff}
.btn.lav{background:var(--lav);color:#fff}
.btn.small{min-height:40px;padding:6px 14px;font-size:.9rem;box-shadow:0 3px 0 var(--btnEdge)}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-block;border-radius:999px;padding:2px 12px;font-size:.8rem;background:var(--lavL);color:var(--lav);letter-spacing:.04em}
.pill.pk{background:var(--pinkL);color:var(--pink)}
.sub{color:var(--sub);font-size:.9rem;font-weight:500}
.count{display:flex;align-items:baseline;gap:6px;font-family:var(--head)}
.count b{font-size:2.4rem;color:var(--pink);font-weight:400;font-variant-numeric:tabular-nums}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subj{text-align:left;display:flex;flex-direction:column;gap:6px;border-radius:24px;padding:14px;min-height:auto}
.subj .nm{font-family:var(--head);font-weight:400;font-size:1.25rem}
.bar{height:10px;border-radius:99px;background:var(--pinkL);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);border-radius:99px}
.subj:last-child:nth-child(odd){grid-column:1/-1}
label{font-size:.95rem}
input[type=text]{font:inherit;font-size:1.15rem;width:100%;padding:12px 16px;border-radius:16px;border:2.5px solid var(--line);background:var(--card);color:var(--ink)}
textarea{font:inherit;font-size:1.1rem;width:100%;padding:12px 16px;border-radius:16px;border:2.5px solid var(--line);background:var(--card);color:var(--ink);resize:vertical;line-height:1.6}
textarea:focus-visible{outline:3px solid var(--lav);outline-offset:3px}
textarea[readonly]{background:var(--bg)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.cmp{grid-template-columns:1fr}}
.shiki{white-space:pre-wrap;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;background:var(--bg);border-radius:14px;padding:10px 12px;font-size:1.05rem;min-width:0}
.shiki.ex{background:var(--memo);border:2px dashed var(--memoLine)}
.film{display:flex;gap:6px;background:var(--ink);padding:8px 10px;border-radius:12px;overflow-x:auto}
.film span{flex:0 0 34px;height:34px;border-radius:6px;background:var(--gray);display:grid;place-items:center;color:#fff;font-size:1.1rem}
.film span.ok{background:var(--pink)}.film span.now{background:var(--lav)}
.qhead{display:flex;gap:12px;align-items:center}
.qhead svg{flex:0 0 64px}
.qtext{font-size:1.3rem;line-height:1.6;font-weight:800}
.choices{display:flex;flex-direction:column;gap:12px}
.choices .btn{text-align:left;border-radius:18px;font-size:1.1rem}
.choices .btn.ok{background:var(--okL);border-color:var(--ok);box-shadow:0 5px 0 var(--ok)}
.choices .btn.ng{background:var(--ngL);border-color:var(--ng);box-shadow:0 5px 0 var(--ng)}
.memo{background:var(--memo);border:2px dashed var(--memoLine);border-radius:18px;padding:12px 14px;font-weight:500}
.fb{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--okL)}.fb.ng{background:var(--ngL)}
.fb .big{font-family:var(--head);font-size:1.3rem}
.fb.ok .big{color:var(--ok)}.fb.ng .big{color:var(--ng)}
.kanji{font-size:1.6rem;letter-spacing:.1em}
.kanji .x{color:var(--ng);text-decoration:underline wavy;text-underline-offset:6px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.9);opacity:.4}100%{transform:scale(1);opacity:1}}
.fall{position:fixed;top:-30px;pointer-events:none;font-size:24px;animation:fall 1.5s ease-in forwards;z-index:9}
@keyframes fall{to{transform:translateY(105vh) rotate(260deg)}}
.sticker{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--pink);color:#fff;font-family:var(--head);font-size:2rem;
  padding:14px 28px;border-radius:999px;border:3px solid var(--btnEdge);box-shadow:0 6px 0 var(--btnEdge);z-index:10;animation:purun .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes purun{0%{transform:translate(-50%,-50%) scale(.3)}100%{transform:translate(-50%,-50%) scale(1)}}
.share{background:var(--lavL);border-radius:16px;padding:12px;white-space:pre-wrap;font-weight:500;user-select:all;overflow-wrap:anywhere}
.pic{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:center}
.pic svg{width:100%;max-width:340px;height:auto;display:block}
.pictag{align-self:flex-start;font-family:var(--head);font-size:.9rem;color:var(--pink)}
.piccap{font-size:.95rem;text-align:center}
.pic.pre svg{max-width:220px}
body.typing .top,body.typing .film,body.typing .qhead svg,body.typing .pic.pre{display:none}
body.typing .wrap{gap:10px}
body.typing #qc{padding:14px;gap:10px}
.teachcard{border-top:2px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:99px;font-size:.9rem;z-index:11}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
const SUBJ={
  koku:{nm:"国語",col:"var(--pink)",prop:"brush"},
  math:{nm:"数学",col:"var(--lav)",prop:"ruler"},
  eng:{nm:"英語",col:"var(--pink)",prop:"abc"},
  sci:{nm:"理科",col:"var(--lav)",prop:"flask"},
  soc:{nm:"社会",col:"var(--pink)",prop:"globe"}
};
// c[0] が正解（表示時にシャッフル）。t:"in" は書いて答える問題
const Q=[
// ===== 国語 =====
{id:"K01",s:"koku",u:"漢字の書き",t:"in",a:"郵便",q:["「ゆうびん」を漢字で書こう。","手紙や荷物を届けるしくみ「ゆうびん」。漢字で書くと？","「ゆうびん局へ行く」の「ゆうびん」を漢字で！"],why:"「郵」は手紙を送る、「便」はたより・ことづて。",tip:"「垂」に「おおざと（阝）」で「郵」。右側は阝だよ。",hint:"1字目の右側は「おおざと」だよ。"},
{id:"K02",s:"koku",u:"漢字の書き",t:"in",a:"単純",q:["「たんじゅん」を漢字で書こう。","「たんじゅんな計算ミス」の「たんじゅん」は？","しくみがかんたんなこと「たんじゅん」。漢字で！"],why:"「単」はひとつ、「純」はまじりけがない。",tip:"「純」は糸へん。「順」と書きまちがえやすいよ。",hint:"2字目は「糸へん」の字だよ。"},
{id:"K03",s:"koku",u:"漢字の読み",c:["いちじるしい","あきらかしい","ちょしい","めざましい"],q:["「著しい」の読みは？","「成長が著しい」の「著しい」はどう読む？","次の読みを選ぼう：「著しい」"],why:"「著しい」＝いちじるしい。目立ってはっきりしているという意味。",tip:"「著者（ちょしゃ）」の「著」。訓読みは「いちじるしい」と「あらわす」。",hint:"ひらがなで6文字の読み方だよ。"},
{id:"K04",s:"koku",u:"敬語",tg:"入試よく出る",c:["いらっしゃる","参る","伺う","お来になる"],q:["「先生が来る」を尊敬語にすると「先生が〇〇」。〇〇は？","目上の人が「来る」とき、ふさわしい尊敬語は？","「校長先生が教室に来る」。正しい尊敬語はどれ？"],why:"尊敬語は相手の動作を高める。「来る」の尊敬語は「いらっしゃる」。",tip:"「参る・伺う」は自分がへりくだる謙譲語。主語が先生なら尊敬語！",hint:"動作をしているのは先生。先生を高める言い方を選ぼう。"},
{id:"K05",s:"koku",u:"品詞",c:["形容動詞","形容詞","副詞","連体詞"],q:["「静かな部屋」の「静かな」の品詞は？","「静かな」は何という品詞？","「教室が静かだ」「静かな教室」。この「静かだ」の品詞は？"],why:"言い切りが「静かだ」と「だ」で終わる、様子を表す言葉は形容動詞。",tip:"言い切りが「〜い」なら形容詞、「〜だ」なら形容動詞。",hint:"言い切りの形にすると何で終わるかな？"},
{id:"K06",s:"koku",u:"熟語の構成",tg:"入試よく出る",c:["下の字が上の字の目的や対象を表す","似た意味の字を重ねる","反対の意味の字を重ねる","上の字が下の字を修飾する"],q:["「登山」の熟語の組み立ては？","熟語「登山」はどんな構成？","「登山」と同じ組み立ての熟語は「読書」。どんな構成かな？"],why:"「登山」＝山に登る。下の字が「〜を・〜に」にあたる。",tip:"下から読んで「〜を（に）〜する」になれば、このタイプ。",hint:"下の字から上の字へ読んでみよう。"},
{id:"K07",s:"koku",u:"四字熟語",c:["一石二鳥","一朝一夕","一期一会","一心同体"],q:["ひとつのことで、ふたつの得をすること。四字熟語は？","「部活のランニングで体力もつき、通学も楽になった」。ぴったりの四字熟語は？","一度に二つの利益を得る意味の四字熟語を選ぼう。"],why:"「一石二鳥」＝石を一つ投げて鳥を二羽とる、から。",tip:"石1個で鳥2羽、と絵で思いうかべよう。",hint:"数字の「一」と「二」が入っているよ。"},
{id:"K08",s:"koku",u:"古文",tg:"入試よく出る",c:["趣がある","おかしくて笑える","かわいそうだ","おそろしい"],q:["古文の「をかし」の意味は？","『枕草子』によく出る「をかし」。現代語に直すと？","古文で「いとをかし」とあったら、どんな気持ち？"],why:"古文の「をかし」は「趣がある・心ひかれる」。今の「おかしい」とは意味がちがう。",tip:"古文の「をかし」は明るくすてき、「あはれ」はしみじみ。",hint:"今の意味「笑える」とはちがうよ。"},
{id:"K09",s:"koku",u:"歴史的仮名遣い",c:["いう","いふ","ゆう","いぶ"],q:["「いふ」を現代仮名遣いに直すと？","古文の「いふ」。今の書き方では？","歴史的仮名遣い「いふ」を、ひらがなで今の書き方にしよう。"],why:"語の頭以外の「は・ひ・ふ・へ・ほ」は「わ・い・う・え・お」になる。",tip:"「ふ」→「う」。「いふ」→「いう」。",hint:"2文字目の「ふ」に注目してね。"},
{id:"K10",s:"koku",u:"慣用句",c:["とてもいそがしい","ねこが好き","手伝いはいらない","のんびりしている"],q:["「猫の手も借りたい」の意味は？","「文化祭の前日は猫の手も借りたいほどだ」。どんな様子？","慣用句「猫の手も借りたい」が表すのは？"],why:"役に立ちそうにない猫の手でも借りたいほど、人手が足りないということ。",tip:"ねこにまで頼みたい＝超いそがしい！",hint:"それくらい人手が足りない、という意味だよ。"},
// ===== 数学 =====
{id:"M01",s:"math",u:"正負の数",c:["17","1","−1","−17"],q:["(−3)² − 2×(−4) を計算しよう。","次の計算の答えは？ (−3)² − 2×(−4)","(−3)² − 2×(−4) ＝ ？"],why:"(−3)²＝9、2×(−4)＝−8。9−(−8)＝17。",tip:"かっこの2乗はマイナスもかける。−×−は＋！",hint:"(−3)²は(−3)×(−3)だよ。"},
{id:"M02",s:"math",u:"平方根",tg:"入試よく出る",c:["5√3","√39","6√3","7√3"],q:["√12 + √27 を計算しよう。","√12 + √27 ＝ ？","次の式を簡単にしよう：√12 + √27"],why:"√12＝2√3、√27＝3√3。2√3＋3√3＝5√3。",tip:"ルートの中は、4・9・16などの平方数を外に出す。",hint:"12＝4×3、27＝9×3と分けてみよう。"},
{id:"M03",s:"math",u:"因数分解",c:["(x−2)(x−3)","(x+2)(x+3)","(x−1)(x−6)","(x+1)(x−6)"],q:["x² − 5x + 6 を因数分解しよう。","因数分解すると？ x² − 5x + 6","x² − 5x + 6 ＝ ？"],why:"かけて＋6、たして−5になる2数は −2と−3。",tip:"「かけて定数、たして係数」の2数をさがす。",hint:"かけて6、たして−5になる数を見つけよう。"},
{id:"M04",s:"math",u:"2次方程式",tg:"入試よく出る",c:["x＝2, −6","x＝−2, 6","x＝3, −4","x＝4, −3"],q:["x² + 4x − 12 ＝ 0 を解こう。","2次方程式 x² + 4x − 12 ＝ 0 の解は？","x² + 4x − 12 ＝ 0 をみたす x は？"],why:"(x+6)(x−2)＝0 なので x＝−6, 2。",tip:"まず因数分解できないか試す。だめなら解の公式。",hint:"かけて−12、たして4になる2数は？"},
{id:"M05",s:"math",u:"関数 y＝ax²",t:"in",a:"2",q:["y＝ax² のグラフが点(2, 8)を通る。aの値は？（数字で）","放物線 y＝ax² が(2, 8)を通るとき、a＝？","点(2, 8)を通る y＝ax²。aを求めよう。"],why:"8＝a×2² → 8＝4a → a＝2。",tip:"通る点のx、yを式に入れればOK。",hint:"x＝2、y＝8を y＝ax² に入れてみよう。"},
{id:"M06",s:"math",u:"関数 y＝ax²",tg:"入試よく出る",c:["4","2","8","3"],q:["y＝x² で、xが1から3まで増えるときの変化の割合は？","関数 y＝x²。x：1→3 の変化の割合を求めよう。","y＝x² について、xが1から3に増加するときの変化の割合は？"],why:"yは1→9で8増える。xは2増える。8÷2＝4。",tip:"変化の割合＝yの増え方÷xの増え方。",hint:"x＝1とx＝3のときのyをそれぞれ出そう。"},
{id:"M07",s:"math",u:"確率",c:["1/6","1/12","7/36","1/9"],q:["2個のさいころを投げて、目の和が7になる確率は？","さいころ2個。出た目の合計が7になる確率を選ぼう。","大小2つのさいころを投げるとき、和が7の確率は？"],why:"全部で36通り。和が7は(1,6)〜(6,1)の6通り。6/36＝1/6。",tip:"さいころ2個は6×6＝36通り。表をかくとミスしない。",hint:"(1,6)のように組を全部書き出してみよう。"},
{id:"M08",s:"math",u:"円",c:["50°","100°","200°","25°"],q:["中心角が100°のとき、同じ弧に対する円周角は？","円で、ある弧に対する中心角が100°。円周角は何度？","同じ弧の中心角100°。円周角を求めよう。"],why:"円周角は、同じ弧に対する中心角の半分。100÷2＝50°。",tip:"円周角＝中心角の半分。",hint:"中心角と円周角の大きさの関係を思い出そう。"},
{id:"M09",s:"math",u:"相似",tg:"入試よく出る",c:["4：9","2：3","8：27","6：9"],q:["相似比が2：3の図形。面積の比は？","2つの相似な三角形の相似比が2：3。面積比を選ぼう。","相似比 2：3 のとき、面積比は？"],why:"面積比は相似比の2乗。2²：3²＝4：9。",tip:"長さはそのまま、面積は2乗、体積は3乗。",hint:"面積はタテ×ヨコ。比を2回かけるよ。"},
{id:"M10",s:"math",u:"三平方の定理",t:"in",a:"10",q:["直角をはさむ2辺が6cmと8cmの直角三角形。斜辺は何cm？（数字で）","直角三角形の2辺が6cm、8cm（直角をはさむ）。斜辺の長さは？","6cmと8cmが直角をはさむ直角三角形の、いちばん長い辺は何cm？"],why:"6²＋8²＝36＋64＝100。√100＝10。",tip:"3：4：5の形。6：8：10はその2倍！",hint:"a²＋b²＝c² を使おう。"},
// ===== 英語 =====

{id:"E02",s:"eng",u:"関係代名詞",c:["who","which","whose","what"],q:["The boy ( ) is running over there is Ken.","( )に入る語は？ The boy ( ) is running over there is Ken.","「むこうで走っている少年はケンです」The boy ( ) is running over there is Ken."],why:"前の名詞（the boy）が人で、あとに動詞が続くので who。",tip:"人→who、もの→which、どちらでもOK→that。",hint:"boyは人？もの？"},

{id:"E05",s:"eng",u:"比較",c:["tallest","taller","tall","most tall"],q:["Tom is the ( ) of the three.","( )に入る語は？ Tom is the ( ) of the three.","「トムは3人の中でいちばん背が高い」Tom is the ( ) of the three."],why:"the＋最上級＋of〜で「〜の中でいちばん」。tallの最上級はtallest。",tip:"of the three ／ in my class があれば最上級。",hint:"the があるね。いちばん？"},

{id:"E07",s:"eng",u:"分詞",c:["sitting","sits","sat","to sit"],q:["Look at the girl ( ) under the tree.","( )に入る語は？ Look at the girl ( ) under the tree.","「木の下にすわっている女の子を見て」Look at the girl ( ) under the tree."],why:"〜ing形が前の名詞を説明して「〜している…」になる。",tip:"〜ingは「している」、過去分詞は「された」。",hint:"女の子は「すわっている」最中だよ。"},

let AC=null;
function tone(f,t0,d,v){const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,AC.currentTime+t0);g.gain.linearRampToValueAtTime(v,AC.currentTime+t0+.01);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t0+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t0);o.stop(AC.currentTime+t0+d+.05)}
function snd(kind){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(kind==="ok"){tone(1318,0,.12,.15);tone(1760,.09,.25,.15)}
  else if(kind==="grad"){[1047,1319,1568,2093,2637].forEach((f,i)=>tone(f,i*.09,.3,.12))}}catch(e){}}

// ---- オリジナルちびキャラ ----
function mascot(prop,size=64){
  // 教科ごとに色ちがいのスマイル
  const col={brush:"--fKoku",ruler:"--fMath",abc:"--fEng",flask:"--fSci",globe:"--fSoc"}[prop]||"--fKoku";
  return `<svg width="${size}" height="${size}" viewBox="0 0 66 66" aria-hidden="true">
  <circle cx="33" cy="34" r="27" fill="var(${col})" stroke="var(--faceInk)" stroke-width="2.5"/>
  <ellipse cx="23" cy="29" rx="3" ry="4" fill="var(--faceInk)"/><ellipse cx="43" cy="29" rx="3" ry="4" fill="var(--faceInk)"/>
  <ellipse cx="16" cy="40" rx="5" ry="3" fill="#fff" opacity=".45"/><ellipse cx="50" cy="40" rx="5" ry="3" fill="#fff" opacity=".45"/>
  <path d="M20 41q13 14 26 0" stroke="var(--faceInk)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>`;
}

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,1800)}
function copy(text,el){
  const done=()=>toast("コピーしたよ！");
  try{navigator.clipboard.writeText(text).then(done,()=>sel(el))}catch(e){sel(el)}
  function sel(e){if(!e)return;const r=document.createRange();r.selectNodeContents(e);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("選んだ文字をコピーしてね")}
}
function daysLeft(){const t=new Date(2027,1,16);const n=new Date();n.setHours(0,0,0,0);return Math.max(0,Math.round((t-n)/864e5))}

function topbar(back){
  return `<div class="top">${back?`<button class="btn small" id="back">← もどる</button>`:`<h1>5教科ノート</h1>`}
  <button class="btn small" id="sndBtn" aria-pressed="${S.sound}">音 ${S.sound?"ON":"OFF"}</button></div>`;
}
function bindTop(){
  document.body.classList.remove("typing");
  document.getElementById("sndBtn").onclick=()=>{S.sound=!S.sound;save();const b=document.getElementById("sndBtn");b.textContent="音 "+(S.sound?"ON":"OFF");b.setAttribute("aria-pressed",S.sound)};
  const b=document.getElementById("back");if(b)b.onclick=home;
}

  const cards=Object.entries(SUBJ).map(([k,v])=>{
    const qs=Q.filter(q=>q.s===k),g=qs.filter(q=>P(q.id).g).length;
    return `<button class="btn subj" data-s="${k}">${mascot(v.prop,44)}<span class="nm">${v.nm}</span></button>`}).join("");
  app.innerHTML=`${topbar(false)}
  <div class="card">
    <div class="count"><span>共通検査まで あと</span><b>${daysLeft()}</b><span>日</span></div>
    <div class="sub">2027年2月16日（火）神奈川県公立高校の学力検査。日程は県の発表や先生に確認してね。</div>
  </div>
  <div class="card">
    <label for="nick">ニックネーム（本名は書かないでね）</label>
    <input type="text" id="nick" maxlength="10" placeholder="例：もちこ" value="${esc(S.nick)}">
  </div>
  <h2>どの教科やる？</h2>
  <div class="subjects">${cards}</div>
  <div class="card">
    <h3>教え合いモード</h3>
    <div class="sub">友達から届いた問題番号（例：M02 H05）を入れると、答えと理由が見られるよ。</div>
    <button class="btn lav" id="teach">番号を入れて教えてもらう</button>
  </div>
  <div class="card">
    <h3>高校えらびノート</h3>
    <div class="sub">横浜・神奈川の高校のこと、入試のしくみ、併願校のことを柴犬に聞けるよ。</div>
    <a class="btn main" href="https://nao-1980.github.io/shiba-navi/" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">高校えらびノートをひらく</a>
    <a class="btn" href="https://claude.ai/artifact/222Lmtp1fc4ZFEYt51S53D" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">受験の予定表をひらく</a>
  </div>
  <div class="memo">1回5問・休み時間で終わる量。どの問題も<b>2回つづけて正解</b>で卒業！ まちがえた問題は少しあとと次の回にまた出るよ。</div>`;
  bindTop();
  document.getElementById("nick").oninput=e=>{S.nick=e.target.value.slice(0,10);save()};
  app.querySelectorAll(".subj").forEach(b=>b.onclick=()=>cats(b.dataset.s));
  document.getElementById("teach").onclick=()=>teach("");
}

// ---- カテゴリをえらぶ ----
function cats(s){
  const all=Q.filter(q=>q.s===s).length;
  const list=[["",all]].concat(CATS[s].map(([n,ids])=>[n,ids.length]));
  app.innerHTML=`${topbar(true)}
  <div class="card"><div class="qhead">${mascot(SUBJ[s].prop,56)}<h2>${SUBJ[s].nm}　どこをやる？</h2></div></div>
  <div class="choices">${list.map(([n,c])=>`<button class="btn cat" data-c="${esc(n)}">${n?esc(n):"ぜんぶまぜる"}<span class="sub">　${c}問</span></button>`).join("")}</div>`;
  bindTop();
  app.querySelectorAll(".cat").forEach(b=>b.onclick=()=>start(s,b.dataset.c));
}

// ---- 出題 ----
let R=null;
function start(s,cat=""){
  const ids=catIds(s,cat);
  const pool=Q.filter(q=>ids.includes(q.id)&&!P(q.id).g);
  if(!pool.length){allDone(s,cat);return}
  const ord=shuf(pool).sort((a,b)=>(P(b.id).w-P(a.id).w)||(P(a.id).seen-P(b.id).seen));
  R={s,cat,queue:ord.slice(0,5).map(q=>q.id),i:0,log:[],first:{},retried:new Set(),hint:false,grads:[]};
  ask();
}
function ask(){
  const id=R.queue[R.i],q=Q.find(x=>x.id===id),p=P(id);R.hint=false;
  const film=R.queue.map((_,k)=>`<span class="${k<R.log.length?(R.log[k]?"ok":""):(k===R.i?"now":"")}">${k<R.log.length?(R.log[k]?"♡":"・"):""}</span>`).join("");
  const body=STEPS[id]
    ?`<label for="shiki">式を書いてね（答えまで書こう）</label><textarea id="shiki" rows="4" placeholder="例：6 ÷ 2 ＝ …"></textarea><button class="btn main" id="reveal">答えを見る</button><div id="rv"></div>`
    :q.t==="in"
    ?`<input type="text" id="ans" autocomplete="off" placeholder="ここに書こう"><button class="btn main" id="go">こたえる</button>`
    :`<div class="choices">${shuf(q.c).map(c=>`<button class="btn ch">${esc(c)}</button>`).join("")}</div>`;
  app.innerHTML=`${topbar(true)}
  <div class="film" aria-label="きょうのログ">${film}</div>
  <div class="card pop" id="qc">
    <div class="row" style="gap:6px"><span class="pill">${SUBJ[q.s].nm}・${esc(catOf(q.id))}</span><span class="pill">${esc(q.u)}</span>${q.tg?`<span class="pill pk">${q.tg}</span>`:""}</div>
    <div class="qhead">${mascot(SUBJ[q.s].prop)}<div class="qtext">${esc(pick(q.q))}</div></div>
    ${PIC[id]&&PIC[id].pre?`<div class="pic pre">${picSVG(id)}</div>`:""}
    ${body}
    <button class="btn small" id="hintBtn">ヒントを見る</button>
    <div class="memo" id="hint" hidden></div>
  </div><div id="fb"></div>`;
  bindTop();
  document.body.classList.remove("typing");
  app.querySelectorAll("#ans,#shiki").forEach(el=>{
    el.addEventListener("focus",()=>{document.body.classList.add("typing");setTimeout(()=>{const t=document.querySelector("#qc");t&&t.scrollIntoView({block:"start",behavior:reduce?"auto":"smooth"})},350)});
    el.addEventListener("blur",()=>setTimeout(()=>{const ae=document.activeElement;if(!ae||(ae.id!=="ans"&&ae.id!=="shiki"))document.body.classList.remove("typing")},300));
  });
  document.getElementById("hintBtn").onclick=()=>{R.hint=true;const h=document.getElementById("hint");h.hidden=false;h.textContent="ヒント："+q.hint};
  if(STEPS[id]){
    const ta=document.getElementById("shiki"),rb=document.getElementById("reveal");
    rb.onclick=()=>{const v=ta.value.trim();if(!v){toast("先に式を書いてね");ta.focus();return}
      ta.readOnly=true;rb.hidden=true;document.getElementById("hintBtn").hidden=true;
      const rv=document.getElementById("rv");
      rv.innerHTML=`<div class="cmp"><div><div class="sub">あなたの式</div><div class="shiki">${esc(v)}</div></div>
        <div><div class="sub">式の例</div><div class="shiki ex">${esc(STEPS[id])}</div></div></div>
        <div class="fb ok" style="background:var(--lavL)"><div>答え：<b class="big" style="color:var(--lav)">${esc(ansText(q))}</b></div></div>
        <div class="sub">自分の答えとくらべてみよう</div>
        <div class="row"><button class="btn main" id="selfOk">あってた♡</button><button class="btn" id="selfNg">ちがった</button></div>`;
      const fin=ok=>{document.getElementById("selfOk").disabled=true;document.getElementById("selfNg").disabled=true;judge(q,ok)};
      document.getElementById("selfOk").onclick=()=>fin(true);
      document.getElementById("selfNg").onclick=()=>fin(false);
    };
  }
  else if(q.t==="in"){const a=document.getElementById("ans");
    const go=()=>{const v=norm(a.value);if(!v)return;judge(q,v===norm(q.a),v)};
    document.getElementById("go").onclick=go;a.onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing)go()}}
  else app.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{
    app.querySelectorAll(".ch").forEach(x=>{x.disabled=true;if(x.textContent===q.c[0])x.classList.add("ok")});
    if(b.textContent!==q.c[0])b.classList.add("ng");judge(q,b.textContent===q.c[0])});
}
function norm(s){return s.replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-65248)).replace(/[\s　]/g,"").replace(/(cm|Ａ|A|J|Ｊ)$/i,"")}
function kanjiMark(user,ans){return [...user].map((c,i)=>c===ans[i]?esc(c):`<span class="x">${esc(c)}</span>`).join("")}
function judge(q,ok,typed){
  document.body.classList.remove("typing");
  const p=P(q.id);p.seen++;
  if(R.first[q.id]===undefined)R.first[q.id]=ok;
  let grad=false;
  if(ok){if(!R.hint){p.st++;if(p.st>=2&&!p.g){p.g=true;grad=true;R.grads.push(q.id)}}p.w=false}
  else{p.st=0;p.w=true;if(!R.retried.has(q.id)){R.retried.add(q.id);R.queue.splice(Math.min(R.i+3,R.queue.length),0,q.id)}}
  R.log.push(ok);save();
  const ae=document.getElementById("ans");if(ae){ae.disabled=true;document.getElementById("go").disabled=true}
  document.getElementById("hintBtn").hidden=true;
  const isK=q.s==="koku";
  const fb=document.getElementById("fb");
  fb.innerHTML=`<div class="card"><div class="fb ${ok?"ok":"ng"} pop">
    <div class="big">${ok?(grad?"卒業！おめでとう":"せいかい！"):"おしい！ここを覚えればOK"}</div>
    ${!ok&&typed!==undefined&&isK?`<div>あなたの答え：<span class="kanji">${kanjiMark(typed,q.a)}</span></div>`:""}
    <div>正解：<b>${esc(ansText(q))}</b></div>
    <div>${esc(q.why)}</div></div>
    ${PIC[q.id]?`<div class="pic"><div class="pictag">絵で覚えよう</div>${picSVG(q.id)}<div class="piccap">${esc(PIC[q.id].cap)}</div></div>`:""}
    <div class="memo"><b>覚え方</b>　${esc(q.tip)}${q.chk?"<br><span class=\"sub\">言葉の使い方は教科書によってちがうことがあるよ。先生に確認してね。</span>":""}</div>
    <button class="btn main" id="next">${R.i+1<R.queue.length?"つぎへ":"結果を見る"}</button></div>`;
  if(ok)snd(grad?"grad":"ok");
  if(grad)celebrate();
  document.getElementById("next").onclick=()=>{R.i++;R.i<R.queue.length?ask():result()};
  if(!reduce)fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function celebrate(){
  if(reduce){toast("卒業！");return}
  for(let i=0;i<18;i++){const s=document.createElement("span");s.className="fall";s.textContent=pick(["♡","★","✿"]);
    s.style.left=Math.random()*100+"vw";s.style.color=pick(["var(--pink)","var(--lav)","var(--memoLine)"]);s.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2000)}
  const st=document.createElement("div");st.className="sticker";st.textContent="卒業！";document.body.appendChild(st);setTimeout(()=>st.remove(),1500);
}

// ---- 結果 ----
function result(){
  const ids=Object.keys(R.first),okN=ids.filter(i=>R.first[i]).length,wrong=ids.filter(i=>!R.first[i]);
  const nm=SUBJ[R.s].nm+(R.cat?"（"+R.cat+"）":""),nick=S.nick.trim()||"ななし";
  const shareTxt=`【5教科ノート】${nick}\n${nm} ${okN}／${ids.length}問せいかい ♡`;
  const teachTxt=wrong.length?`教えて！ 5教科ノートの「教え合い」に入れてね → ${wrong.join(" ")}`:"";
  app.innerHTML=`${topbar(true)}
  <div class="card pop">
    <h2>${nm} おつかれさま！</h2>
    <div class="count"><b>${okN}</b><span>／${ids.length}問 せいかい</span></div>
    <div>${okN===ids.length?"パーフェクト！この調子で卒業をめざそう。":"まちがえた問題は、次の回に先に出るよ。"}</div>
  </div>
  <div class="card"><h3>スコアを見せ合う</h3><div class="share" id="sh">${esc(shareTxt)}</div><button class="btn lav" id="cp1">コピーして友達に送る</button></div>
  ${wrong.length?`<div class="card"><h3>友達に教えてもらう</h3><div class="sub">問題番号だけ送れば、友達のツールで答えと理由が見られるよ。</div><div class="share" id="tc">${esc(teachTxt)}</div><button class="btn lav" id="cp2">番号をコピー</button></div>`:""}
  <div class="row"><button class="btn main" id="again">もう1回</button><button class="btn" id="cat">ほかの${SUBJ[R.s].nm}をやる</button><button class="btn" id="home">教科をえらぶ</button></div>`;
  bindTop();
  document.getElementById("cp1").onclick=()=>copy(shareTxt,document.getElementById("sh"));
  if(wrong.length)document.getElementById("cp2").onclick=()=>copy(teachTxt,document.getElementById("tc"));
  document.getElementById("again").onclick=()=>start(R.s,R.cat);
  document.getElementById("cat").onclick=()=>cats(R.s);
  document.getElementById("home").onclick=home;
}
function allDone(s,cat=""){
  const nm=SUBJ[s].nm+(cat?"（"+cat+"）":"");
  app.innerHTML=`${topbar(true)}<div class="card pop"><h2>${esc(nm)} ぜんぶ卒業！</h2>
  <div>${mascot(SUBJ[s].prop,90)}</div><div>すごい！ほかのカテゴリにも挑戦しよう。もう一度やりたいときは、記録をリセットしてね。</div>
  <button class="btn" id="rs">${esc(nm)}の記録をリセット</button><button class="btn" id="oc">ほかの${SUBJ[s].nm}をやる</button></div>`;
  bindTop();
  document.getElementById("oc").onclick=()=>cats(s);
  document.getElementById("rs").onclick=()=>{catIds(s,cat).forEach(id=>delete S.p[id]);save();cats(s)};
}

// ---- 教え合い ----
function teach(val){
  app.innerHTML=`${topbar(true)}<div class="card">
    <h2>教え合いモード</h2>
    <label for="codes">友達から届いた番号（スペース区切り）</label>
    <input type="text" id="codes" placeholder="例：M02 H05" value="${esc(val)}">
    <button class="btn main" id="show">答えと理由を見る</button>
    <div id="tout"></div></div>`;
  bindTop();
  const run=()=>{
    const codes=(document.getElementById("codes").value.toUpperCase().match(/[KMESH]\d{2}/g)||[]);
    const out=codes.map(c=>Q.find(q=>q.id===c)).filter(Boolean);
    document.getElementById("tout").innerHTML=out.length?out.map(q=>`<div class="teachcard">
      <span class="pill">${q.id}・${SUBJ[q.s].nm}・${esc(catOf(q.id))}</span>
      <div><b>${esc(q.q[0])}</b></div>
      <div>正解：<b>${esc(ansText(q))}</b></div>
      ${STEPS[q.id]?`<div class="shiki ex">${esc(STEPS[q.id])}</div>`:""}
      <div>${esc(q.why)}</div>
      ${PIC[q.id]?`<div class="pic">${picSVG(q.id)}<div class="piccap">${esc(PIC[q.id].cap)}</div></div>`:""}
      <div class="memo"><b>覚え方</b>　${esc(q.tip)}</div></div>`).join("")
      :`<div class="sub">番号が見つからなかったよ。M02 のように「英字1つ＋数字2つ」で入れてね。</div>`;
  };
  document.getElementById("show").onclick=run;
  if(val)run();
}
home();
</script>
